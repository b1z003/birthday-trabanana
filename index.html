<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Birthday OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Landing screen -->
    <div id="landing-page" class="overlay">
        <div class="boot-lines" aria-hidden="true">
            <p>&gt; system boot .......... OK</p>
            <p>&gt; loading celebration.dll ... OK</p>
            <p>&gt; party_modules = 100%</p>
        </div>
        <button id="start-btn">INITIALIZE BIRTHDAY PROTOCOL</button>
    </div>

    <!-- Celebration screen -->
    <div id="celebration-zone" class="hidden">
        <div class="stars" id="star-container"></div>
        <div class="sky" id="balloon-container"></div>
        <canvas id="confetti"></canvas>

        <div class="cake-container">
            <h1 class="name-display">HAPPY BIRTHDAY <span id="user-name">TRABANANA</span></h1>

            <div class="cake">
                <div class="candle">
                    <div class="wick"></div>
                    <div class="flame" id="flame"></div>
                    <div class="smoke" id="smoke"></div>
                </div>
                <div class="tier tier-top"></div>
                <div class="tier tier-bottom"></div>
                <div class="plate"></div>
            </div>

            <p class="wish" id="wish">Make a wish and blow out the candle ✨</p>

            <!-- Camera feature launcher -->
            <div class="cam-launcher">
                <p class="cam-launcher-note">
                    These use your camera — nothing is uploaded. You'll be asked to allow access.
                </p>
                <div class="cam-launcher-buttons">
                    <button class="cam-launch" data-mode="photo">📸 Photo Booth</button>
                    <button class="cam-launch" data-mode="blow">🌬️ Blow the Candle</button>
                    <button class="cam-launch" data-mode="record">🎥 Video Message</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Camera panel -->
    <div id="camera-panel" class="hidden">
        <div class="cam-card">
            <div class="cam-header">
                <span class="cam-badge"><span class="dot"></span> CAMERA ON</span>
                <button id="cam-close" title="Close">✕</button>
            </div>

            <div class="cam-stage">
                <video id="cam-video" playsinline autoplay muted></video>
                <canvas id="cam-canvas" class="hidden"></canvas>
                <img id="cam-photo" class="hidden" alt="Your birthday photo">
                <div id="rec-badge" class="rec-badge hidden"><span class="dot"></span> REC</div>
                <div id="cam-status" class="cam-status">Tap an option to allow camera access</div>
            </div>

            <div class="cam-meter-wrap hidden" id="blow-meter-wrap">
                <label>Blow strength</label>
                <div class="cam-meter"><div class="cam-meter-fill" id="blow-meter-fill"></div></div>
            </div>

            <div class="cam-controls" id="cam-controls"></div>
            <p class="cam-hint" id="cam-hint"></p>
        </div>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
